{% extends 'base.html' %}

{% block title %}Student Registration{% endblock %}

{% block content %}
    <h1 class="text-center mb-4">Student Registration</h1>

    <!-- Display success messages -->
    {% if messages %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        <ul class="mb-0">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <!-- Registration Form -->
    <form method="POST" class="p-4 border rounded shadow-sm bg-light">
        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter student's name" required>
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Age:</label>
            <input type="number" id="age" name="age" class="form-control" placeholder="Enter student's age" required>
        </div>

        <div class="mb-3">
            <label for="student_class" class="form-label">Class:</label>
            <select id="student_class" name="student_class" class="form-select" required>
                <option value="" disabled selected>Select Class</option>
                {% for i in class_range %}
                    <option value="{{ i }}">Class {{ i }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="parent_contact" class="form-label">Parent Contact:</label>
            <input type="text" id="parent_contact" name="parent_contact" class="form-control" placeholder="Enter parent's contact number" required>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Register</button>
        </div>
    </form>
{% endblock %}
